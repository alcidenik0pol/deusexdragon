<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Deus Ex Neon Merlion</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .canvas-container {
            width: 100%;
            height: 100%;
            background: #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
    <!-- Bundle.js is injected here by webpack -->
</head>
<body>
    <div class="canvas-container">
        <canvas id="renderCanvas"></canvas>
    </div>
</body>
</html>
