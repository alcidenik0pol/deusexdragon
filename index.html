<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deus Ex Dragon</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #debugOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-family: Arial;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="debugOverlay">
        Position: (0, 0, 0)<br>
        Rotation: 0
    </div>

    <script type="module">
        import { LevelGenerator } from './levelGenerator.js';
        import { SingaporeLevel } from './levels/singaporeLevel.js';
        import { Singapore2Level } from './levels/singapore2Level.js';
        import { Singapore3Level } from './levels/singapore3Level.js';
        import { LadiesRoomLevel } from './levels/ladiesRoomLevel.js';
        import { loadCharacters } from './characters/maincharacter.js';
        import { ChatUI } from './chat/chatUI.js';
        import { ChatService } from './chat/chatService.js';
        import { loadNPC1 } from './characters/npc1.js';
        import { GameCamera } from './camera.js';
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const debugOverlay = document.getElementById("debugOverlay");

        // Add level selection
        let currentScene = null;
        let currentLevelType = 'default';  // Track current level type
        let currentCharacter = null;  // Define currentCharacter here

        // Available levels list
        const availableLevels = ['default', 'singapore', 'singapore2', 'singapore3', 'ladiesroom'];

        const createScene = async (levelType = 'default') => {
            const scene = new BABYLON.Scene(engine);
            
            // Create camera
            const gameCamera = new GameCamera(canvas, scene);

            // Lighting
            const light = new BABYLON.HemisphericLight("light", 
                new BABYLON.Vector3(0, 1, 0), scene);

            // Check the level type and instantiate the appropriate level generator
            let levelGenerator;
            switch (levelType) {
                case 'singapore':
                    levelGenerator = new SingaporeLevel(scene);
                    break;
                case 'singapore2':
                    levelGenerator = new Singapore2Level(scene);
                    break;
                case 'singapore3':
                    levelGenerator = new Singapore3Level(scene);
                    break;
                case 'ladiesroom':
                    levelGenerator = new LadiesRoomLevel(scene);
                    break;
                default:
                    levelGenerator = new LevelGenerator(scene);
            }
            
            const { ground, walls, cellSize } = await levelGenerator.createLevel();

            // Character setup (moved to maincharacter.js)
            const { idleCharacter, runningCharacter } = await loadCharacters(scene);  // Updated to load characters

            // Set currentCharacter to idleCharacter initially
            currentCharacter = idleCharacter;  // Set the initial current character
            gameCamera.setCharacter(currentCharacter);  // Set the character for the camera

            // Modify material properties for all meshes in the model
            idleCharacter.getChildren().forEach(mesh => {  // Use idleCharacter directly
                if (mesh.material) {
                    mesh.material.emissiveColor = BABYLON.Color3.Black(); // Remove any self-illumination
                    mesh.material.ambientColor = BABYLON.Color3.Black();  // Make it fully affected by scene lighting
                }
            });

            // Set up both models with same properties
            [idleCharacter, runningCharacter].forEach(char => {
                char.scaling = new BABYLON.Vector3(1, 1, 1);
                char.position = new BABYLON.Vector3(0, 0.1, 0);
                // Create quaternion for 270 degree rotation around Y axis
                char.rotationQuaternion = BABYLON.Quaternion.RotationAxis(
                    BABYLON.Vector3.Up(), 
                    -Math.PI/2
                );
            });

            // Start with idle animation visible, running hidden
            runningCharacter.setEnabled(false);
            idleCharacter.setEnabled(true);

            // Simple key handler to switch animations
            window.addEventListener("keydown", (e) => {
                if (ChatUI.isActive && e.key !== "e") return;  // Block all keys except 'e' when chat is active
                if (e.key === "w") {
                    idleCharacter.setEnabled(false);
                    runningCharacter.setEnabled(true);
                    currentCharacter = runningCharacter;
                }
            });

            window.addEventListener("keyup", (e) => {
                if (ChatUI.isActive && e.key !== "e") return;  // Block all keys except 'e' when chat is active
                if (e.key === "w") {
                    idleCharacter.setEnabled(true);
                    runningCharacter.setEnabled(false);
                    currentCharacter = idleCharacter;
                }
            });

            // Movement setup
            const keys = { w: false, a: false, s: false, d: false };
            const moveSpeed = gameCamera.thirdPersonProfile.speed;

            window.addEventListener("keydown", (e) => {
                if (ChatUI.isActive) return;  // Block all keys when chat is active
                if (e.key in keys) keys[e.key] = true;
            });
            window.addEventListener("keyup", (e) => {
                if (ChatUI.isActive) return;  // Block movement when chat is active
                if (e.key in keys) keys[e.key] = false;
            });

            // Animation Loop
            scene.registerBeforeRender(() => {
                // Get camera's forward direction
                const cameraDirection = gameCamera.getCameraDirection();
                
                // Calculate right vector
                const right = BABYLON.Vector3.Cross(cameraDirection, BABYLON.Vector3.Up());

                // Calculate movement
                let moveVector = BABYLON.Vector3.Zero();
                
                if (keys.w || keys.s) {
                    moveVector.addInPlace(cameraDirection.scale(keys.w ? moveSpeed : -moveSpeed));
                    
                    const targetAngle = Math.atan2(cameraDirection.x, cameraDirection.z);
                    const targetQuaternion = BABYLON.Quaternion.RotationAxis(
                        BABYLON.Vector3.Up(), 
                        targetAngle
                    );
                    idleCharacter.rotationQuaternion = targetQuaternion;
                    runningCharacter.rotationQuaternion = targetQuaternion;
                }
                
                if (keys.a) moveVector.addInPlace(right.scale(moveSpeed));
                if (keys.d) moveVector.addInPlace(right.scale(-moveSpeed));

                if (moveVector.length() > 0) {
                    currentCharacter.position.addInPlace(moveVector);
                    idleCharacter.position = currentCharacter.position.clone();
                    runningCharacter.position = currentCharacter.position.clone();
                }

                // Update camera
                gameCamera.update();
            });

            console.log("Idle character properties:", idleCharacter);

            scene.ambientColor = BABYLON.Color3.Black(); // Reduce ambient light
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1); // Dark background
            scene.materialsNeedSceneLighting = true;

            let npcs = [];  // Array to store active NPCs

            // Load and setup NPCs
            if (levelType === 'ladiesroom') {  // Only load NPCs in relevant levels
                const npc1 = await loadNPC1(scene);
                npcs.push(npc1);
            }

            // Modify the chat UI setup
            let chatUI = null;

            // Function to find closest NPC
            const findClosestNPC = () => {
                if (!currentCharacter || npcs.length === 0) return null;
                
                const playerPos = currentCharacter.position;
                let closestNPC = null;
                let closestDistance = Infinity;
                
                npcs.forEach(npc => {
                    const distance = BABYLON.Vector3.Distance(
                        playerPos,
                        npc.mesh.position
                    );
                    
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        closestNPC = npc;
                    }
                });
                
                // Return the NPC only if within 1 tile (assuming tile size)
                return closestDistance <= 3 ? closestNPC : null;
            };

            // Modify the 'E' key handler
            window.addEventListener("keydown", (e) => {
                if (e.key === "e") {
                    if (!chatUI) {
                        chatUI = new ChatUI();
                    }
                    
                    // If chat is active, don't handle 'E' key at all
                    // This allows typing 'E' in the chat
                    if (ChatUI.isActive) {
                        return;
                    }
                    
                    // Prevent the 'e' from being typed when opening chat
                    e.preventDefault();
                    
                    // Only try to open chat if it's not active
                    const nearbyNPC = findClosestNPC();
                    if (nearbyNPC) {
                        chatUI.setNPC(nearbyNPC);
                        chatUI.show();
                    } else {
                        console.log("No NPCs nearby. Get closer to talk to someone!");
                    }
                }
            });

            return scene;
        };

        window.addEventListener("keydown", async (e) => {
            if (ChatUI.isActive && e.key !== "e") return;  // Block level selection when chat is active
            if (e.key.toLowerCase() === 'l') {
                // Prompt for level name
                const newLevel = prompt(
                    `Enter level name (${availableLevels.join(', ')}):`,
                    currentLevelType
                );
                
                // Check if input is valid and different from current level
                if (newLevel && 
                    availableLevels.includes(newLevel.toLowerCase()) && 
                    newLevel.toLowerCase() !== currentLevelType) {
                    
                    currentLevelType = newLevel.toLowerCase();
                    
                    // Dispose of current scene and create new one
                    if (currentScene) {
                        currentScene.dispose();
                    }
                    currentScene = await createScene(currentLevelType);
                }
            }
            
            // New rain toggle handler
            if (!ChatUI.isActive && e.key.toLowerCase() === 'r' && currentLevelType === 'singapore') {
                const scene = currentScene;
                // Find the level generator instance
                const levelObjects = scene.meshes.find(mesh => mesh.levelGenerator);
                if (levelObjects && levelObjects.levelGenerator instanceof SingaporeLevel) {
                    levelObjects.levelGenerator.toggleRain();
                }
            }
        });

        const main = async () => {
            currentScene = await createScene(currentLevelType);
            engine.runRenderLoop(() => {
                if (currentScene) {
                    currentScene.render();
                }
            });
        };

        main();

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
