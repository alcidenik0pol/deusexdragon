<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Deus Ex Dragon</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #debugOverlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-family: Arial;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="debugOverlay">
        Position: (0, 0, 0)<br>
        Rotation: 0
    </div>

    <script type="module">
        import { LevelGenerator } from './levelGenerator.js';
        import { SingaporeLevel } from './levels/singaporeLevel.js';
        import { Singapore2Level } from './levels/singapore2Level.js';
        import { Singapore3Level } from './levels/singapore3Level.js';
        import { LadiesRoomLevel } from './levels/ladiesRoomLevel.js';
        import { loadCharacters } from './characters/maincharacter.js';
        import { ChatUI } from './chat/chatUI.js';
        import { ChatService } from './chat/chatService.js';
        import { loadNPC1 } from './characters/npc1.js';
        import { GameCamera } from './camera.js';
        import { Controls } from './controls.js';
        import { Singapore4Level } from './levels/singapore4Level.js';
        import { NightTestLevel } from './levels/nightTestLevel.js';
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const debugOverlay = document.getElementById("debugOverlay");

        // Add level selection
        let currentScene = null;
        // let currentLevelType = 'default';  // Track current level type
        let currentLevelType = 'nighttest';  // Track current level type
        let currentCharacter = null;  // Define currentCharacter here

        // Available levels list
        const availableLevels = ['default', 'singapore', 'singapore2', 'singapore3', 'singapore4', 'ladiesroom', 'nighttest'];

        const createScene = async (levelType = 'default') => {
            const scene = new BABYLON.Scene(engine);
            
            // Create and configure camera
            const gameCamera = new GameCamera(canvas, scene);
            
            // Enable pointer lock on scene click
            scene.onPointerDown = () => {
                if (!scene.getEngine().isPointerLock) {
                    canvas.requestPointerLock = canvas.requestPointerLock || 
                                              canvas.msRequestPointerLock || 
                                              canvas.mozRequestPointerLock || 
                                              canvas.webkitRequestPointerLock;
                    if (canvas.requestPointerLock) {
                        canvas.requestPointerLock();
                    }
                }
            };

            // Add pointer move event for camera control
            scene.onPointerMove = (evt) => {
                if (scene.getEngine().isPointerLock) {
                    gameCamera.camera.rotation.y += evt.movementX * 0.002;
                    gameCamera.camera.rotation.x += evt.movementY * 0.002;
                    
                    const upperLimit = Math.PI / 3;
                    const lowerLimit = -Math.PI / 3;
                    gameCamera.camera.rotation.x = Math.min(upperLimit, Math.max(lowerLimit, gameCamera.camera.rotation.x));
                }
            };

            // Remove any reference to FollowCam
            scene.name = levelType;  // Just use levelType as scene name

            // Check the level type and instantiate the appropriate level generator
            let levelGenerator;
            switch (levelType) {
                case 'singapore':
                    levelGenerator = new SingaporeLevel(scene);
                    break;
                case 'singapore2':
                    levelGenerator = new Singapore2Level(scene);
                    break;
                case 'singapore3':
                    levelGenerator = new Singapore3Level(scene);
                    break;
                case 'singapore4':
                    levelGenerator = new Singapore4Level(scene);
                    break;
                case 'ladiesroom':
                    levelGenerator = new LadiesRoomLevel(scene);
                    break;
                case 'nighttest':
                    levelGenerator = new NightTestLevel(scene);
                    break;
                default:
                    levelGenerator = new LevelGenerator(scene);
            }
            
            const { ground, walls, cellSize } = await levelGenerator.createLevel();

            // Load characters ONCE
            const { idleCharacter, forwardCharacter, backwardCharacter, leftCharacter, rightCharacter } = await loadCharacters(scene);
            
            // Initialize controls with all character models
            const controls = new Controls(
                scene, 
                idleCharacter, 
                forwardCharacter, 
                backwardCharacter, 
                leftCharacter, 
                rightCharacter, 
                gameCamera  // Pass the camera instance directly
            );

            // Set current character
            currentCharacter = controls.getCurrentCharacter();
            gameCamera.setCharacter(currentCharacter);

            // Scene settings
            scene.ambientColor = BABYLON.Color3.Black();
            scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);
            scene.materialsNeedSceneLighting = true;

            // NPC setup
            let npcs = [];
            if (levelType === 'ladiesroom') {
                const npc1 = await loadNPC1(scene);
                npcs.push(npc1);
            }

            // Chat UI setup
            let chatUI = null;

            // Function to find closest NPC
            const findClosestNPC = () => {
                if (!currentCharacter || npcs.length === 0) return null;
                
                const playerPos = currentCharacter.position;
                let closestNPC = null;
                let closestDistance = Infinity;
                
                npcs.forEach(npc => {
                    const distance = BABYLON.Vector3.Distance(
                        playerPos,
                        npc.mesh.position
                    );
                    
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        closestNPC = npc;
                    }
                });
                
                return closestDistance <= 3 ? closestNPC : null;
            };

            // Chat key handler
            window.addEventListener("keydown", (e) => {
                if (e.key === "e") {
                    if (!chatUI) {
                        chatUI = new ChatUI();
                    }
                    
                    if (ChatUI.isActive) {
                        return;
                    }
                    
                    e.preventDefault();
                    
                    const nearbyNPC = findClosestNPC();
                    if (nearbyNPC) {
                        chatUI.setNPC(nearbyNPC);
                        chatUI.show();
                    } else {
                        console.log("No NPCs nearby. Get closer to talk to someone!");
                    }
                }
            });

            return scene;
        };

        window.addEventListener("keydown", async (e) => {
            if (ChatUI.isActive && e.key !== "e") return;  // Block level selection when chat is active
            if (e.key.toLowerCase() === 'l') {
                // Prompt for level name
                const newLevel = prompt(
                    `Enter level name (${availableLevels.join(', ')}):`,
                    currentLevelType
                );
                
                // Check if input is valid and different from current level
                if (newLevel && 
                    availableLevels.includes(newLevel.toLowerCase()) && 
                    newLevel.toLowerCase() !== currentLevelType) {
                    
                    currentLevelType = newLevel.toLowerCase();
                    
                    // Dispose of current scene and create new one
                    if (currentScene) {
                        currentScene.dispose();
                    }
                    currentScene = await createScene(currentLevelType);
                }
            }
            
            // New rain toggle handler
            if (!ChatUI.isActive && e.key.toLowerCase() === 'r' && currentLevelType === 'singapore') {
                const scene = currentScene;
                // Find the level generator instance
                const levelObjects = scene.meshes.find(mesh => mesh.levelGenerator);
                if (levelObjects && levelObjects.levelGenerator instanceof SingaporeLevel) {
                    levelObjects.levelGenerator.toggleRain();
                }
            }
        });

        const main = async () => {
            currentScene = await createScene(currentLevelType);
            engine.runRenderLoop(() => {
                if (currentScene) {
                    currentScene.render();
                }
            });
        };

        main();

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
